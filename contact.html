<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연락처 | 나경공인중개사사무소</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="contact" id="top">

  <header class="page-hero">
    <div data-nav></div>
    <div class="page-hero__copy">
      <p class="crumb"><a href="index.html">홈</a> <span aria-hidden="true">/</span> 연락처</p>
      <h1>연락처 · 오시는 길</h1>
      <p class="page-hero__lead">방문 전에 전화 주시면 원하시는 매물을 미리 준비해 두겠습니다.</p>
    </div>
    <svg class="page-hero__skyline" viewBox="0 0 280 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 88h276"/><path d="M14 88V52l30-24 30 24v36"/><path d="M36 88V68h16v20"/>
      <path d="M90 88V20h44v68"/><path d="M100 32h8M116 32h8M100 46h8M116 46h8M100 60h8M116 60h8M100 74h8M116 74h8"/>
      <path d="M144 88V44h34v44"/><path d="M152 56h6M164 56h6M152 70h6M164 70h6"/>
      <path d="M212 88V60"/><ellipse cx="212" cy="44" rx="16" ry="24"/><path d="M252 88V68"/><ellipse cx="252" cy="56" rx="11" ry="16"/>
    </svg>
  </header>

  <main class="page wrap contact-layout">
    <section class="contact-card">
      <h2>나경 공인중개사사무소</h2>
      <dl class="contact-info">
        <div><dt>대표</dt><dd data-office="ceo"></dd></div>
        <div><dt>전화</dt><dd><a class="big-phone" href="tel:010-3381-0856" data-office="phone"></a> <button class="btn btn--ghost btn--sm" type="button" data-copy="010-3381-0856">복사</button></dd></div>
        <div><dt>이메일</dt><dd><a href="mailto:nk2022@naver.com" data-office="email"></a></dd></div>
        <div><dt>주소</dt><dd data-office="address"></dd></div>
        <div><dt>영업시간</dt><dd data-office="hours"></dd></div>
        <div><dt>등록번호</dt><dd data-office="regNo"></dd></div>
      </dl>
      <div class="map-links">
        <a class="btn btn--dark" href="https://map.naver.com/p/search/%EC%A0%9C%EC%A3%BC%EC%8B%9C%20%EA%B5%AD%EA%B8%B0%EB%A1%9C%2014" target="_blank" rel="noopener">네이버 지도</a>
        <a class="btn btn--ghost" href="https://map.kakao.com/?q=%EC%A0%9C%EC%A3%BC%EC%8B%9C%20%EA%B5%AD%EA%B8%B0%EB%A1%9C%2014" target="_blank" rel="noopener">카카오맵</a>
      </div>
    </section>

    <section class="contact-form" id="form">
      <h2>상담 신청</h2>
      <p class="muted">남겨 주시면 영업시간 안에 연락드립니다.</p>
      <form id="contact-form" class="finder">
        <label>이름<input name="name" id="c-name" required autocomplete="name" /></label>
        <label>연락처<input name="phone" id="c-phone" type="tel" required placeholder="010-0000-0000" autocomplete="tel" /></label>
        <label>관심 분야
          <select name="topic" id="c-topic">
            <option>아파트 · 빌라</option><option>토지 매매</option><option>상가 임대 · 매매</option><option>투자 상담</option><option>경매컨설팅</option><option>기타</option>
          </select>
        </label>
        <label>희망 방문일<input name="date" id="c-date" type="date" /></label>
        <label>문의 내용<textarea name="message" id="c-message" rows="5" placeholder="원하시는 지역, 예산, 입주 시기 등을 적어 주세요."></textarea></label>
        <button class="btn btn--dark" type="submit">상담 신청 보내기</button>
        <p class="finder__result" id="form-note" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div data-footer></div>
  <script src="assets/layout.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
