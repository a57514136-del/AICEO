# 매일 아침 국토교통부 실거래가를 조회해 data/trades.json 을 갱신합니다.
# 저장소 Settings → Secrets and variables → Actions 에 MOLIT_API_KEY 를 등록하세요.
name: 실거래가 자동 조회

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 실거래가 조회
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          LAWD_CODES: "50110:제주시,50130:서귀포시"
        run: node scripts/fetch-trades.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trades.json data/trades.js
          git diff --cached --quiet || git commit -m "실거래가 자동 갱신 $(date -u +%F)"
          git push
